<!-- templates/Login.html -->
<div class="bg-white p-8 rounded-lg shadow-lg w-96 mx-auto">
    <h2 class="text-2xl font-semibold text-center text-gray-700 mb-6">Вход в систему</h2>
    
    <form id="loginForm" action="#" method="POST">
        <!-- Поле для имени пользователя -->
        <div class="mb-4">
            <label for="username" class="block text-gray-700">Имя пользователя</label>
            <input type="text" id="username" name="username"
                class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                required>
        </div>
        
        <!-- Поле для пароля -->
        <div class="mb-6">
            <label for="password" class="block text-gray-700">Пароль</label>
            <input type="password" id="password" name="password"
                class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                required>
        </div>
        
        <!-- Кнопка для отправки формы -->
        <button type="submit"
            class="w-full bg-blue-500 text-white p-3 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
            Войти
        </button>
    </form>

    <div class="mt-4 text-center">
        <a href="#" id="toRegister" class="text-sm text-blue-500 hover:underline">Нет аккаунта? Зарегистрироваться</a>
    </div>
</div>
