<!-- templates/Registration.html -->
<div class="bg-white p-8 rounded-lg shadow-lg w-96 mx-auto">
    <h2 class="text-2xl font-semibold text-center text-gray-700 mb-6">Регистрация</h2>
    
    <form id="registerForm" action="#" method="POST">
        <!-- Поле для имени пользователя -->
        <div class="mb-4">
            <label for="username" class="block text-gray-700">Имя пользователя</label>
            <input type="text" id="username" name="username"
                class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                required>
        </div>
        
        <!-- Поле для email -->
        <div class="mb-4">
            <label for="email" class="block text-gray-700">Email</label>
            <input type="email" id="email" name="email"
                class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                required>
        </div>

        <!-- Поле для пароля -->
        <div class="mb-4">
            <label for="password" class="block text-gray-700">Пароль</label>
            <input type="password" id="password" name="password"
                class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                required>
        </div>

        <!-- Поле для подтверждения пароля -->
        <div class="mb-6">
            <label for="confirmPassword" class="block text-gray-700">Подтверждение пароля</label>
            <input type="password" id="confirmPassword" name="confirmPassword"
                class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                required>
        </div>

        <!-- Кнопка для отправки формы -->
        <button type="submit"
            class="w-full bg-blue-500 text-white p-3 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
            Зарегистрироваться
        </button>
    </form>

    <div class="mt-4 text-center">
        <a href="#" id="toLogin" class="text-sm text-blue-500 hover:underline">Уже есть аккаунт? Войти</a>
    </div>
</div>
